function safeLoad(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return demoData();
    const parsed=JSON.parse(raw);
    if(!parsed||!Array.isArray(parsed.projects)||!Array.isArray(parsed.physical))return demoData();
    return {...demoData(),...parsed,ui:{...demoData().ui,...(parsed.ui||{})}};
  }catch(_){return demoData();}
}
let state=safeLoad(), toastTimer=0, searchTimer=0;
function persist(){

function showToast(text){

function ring(value,size=76,color="var(--accent)",label="complete"){

}
function projectStats(){
  const ps=state.projects, live=ps.filter(p=>p.status!=="Paused"), tasks=ps.flatMap(p=>p.tasks||[]);
  const statusCounts=Object.fromEntries(STATUSES.map(s=>[s,ps.filter(p=>p.status===s).length]));
  return {total:ps.length,active:ps.filter(p=>p.status==="Active"||p.status==="Blocked").length,
    overall:live.length?Math.round(live.reduce((a,p)=>a+(+p.progress||0),0)/live.length):0,
    blocked:statusCounts.Blocked,completed:statusCounts.Completed,paused:statusCounts.Paused,
    inDevelopment:ps.filter(p=>["Design","Development","Testing","Deployment"].includes(p.phase)&&["Active","Blocked"].includes(p.status)).length,
    close:ps.filter(p=>p.status!=="Completed"&&p.status!=="Paused"&&p.progress>=75).length,
    openTasks:tasks.filter(t=>t.status!=="done").length,doneTasks:tasks.filter(t=>t.status==="done").length,totalTasks:tasks.length,
    highTasks:tasks.filter(t=>t.status!=="done"&&t.priority==="high").length,statusCounts};

function sortProjects(ps){
  const u=state.ui,q=(u.q||"").trim().toLowerCase();
  const sorts={updated:(a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""),progress:(a,b)=>b.progress-a.progress,priority:(a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority),health:(a,b)=>(b.health??-1)-(a.health??-1),phase:(a,b)=>PHASES.indexOf(b.phase)-PHASES.indexOf(a.phase),name:(a,b)=>a.name.localeCompare(b.name)};
  return ps.filter(p=>u.status==="all"||(u.status==="close"?p.status!=="Completed"&&p.progress>=75:p.status===u.status))
    .filter(p=>u.type==="all"||p.type===u.type)
    .filter(p=>!q||[p.name,p.oneLiner,p.type,p.phase,...(p.technologies||[])].join(" ").toLowerCase().includes(q))
    .slice().sort(sorts[u.sort]||sorts.updated);
}
function nextUp(n=6){
  const rows=[];
  state.projects.filter(p=>p.status==="Active"||p.status==="Blocked").forEach(p=>{
    (p.tasks||[]).filter(t=>t.status!=="done").forEach(t=>{
      const pw=3-PRIORITIES.indexOf(p.priority),tw=2-PRIORITIES.indexOf((t.priority||"medium").replace(/^./,c=>c.toUpperCase()));
      rows.push({p,t,score:pw*10+(t.status==="doing"?6:0)+Math.max(0,tw)*2+(p.progress||0)/25});
    });
  });
  rows.sort((a,b)=>b.score-a.score);
  const used={};return rows.filter(x=>(used[x.p.id]=(used[x.p.id]||0)+1)<=2).slice(0,n);
}

    const done=p.milestones.filter(m=>m.done).length, progress=p.updates.find(u=>u.progress!=null)?.progress??(p.milestones.length?Math.round(done/p.milestones.length*100):0);
    const hours=p.updates.reduce((a,u)=>a+(+u.hours||0),0),spent=p.updates.reduce((a,u)=>a+(+u.cost||0),0);
    return `<a href="#/physical" class="small">← Physical builds</a><section class="card build-detail detail-section"><div class="detail-head">${ring(progress,140,COLORS[p.color%8],"complete")}<div><div class="pc-badges">${pill(p.category)}${pill(p.status)}</div><h1>${esc(p.name)}</h1><p class="muted">${esc(p.description||"")}</p><div class="detail-actions"><button class="btn" data-action="edit-build" data-id="${esc(p.id)}">✎ Edit</button><button class="btn danger" data-action="delete-build" data-id="${esc(p.id)}">Delete</button></div></div></div><div class="grid3 section"><div><small>Milestones</small><b>${done}/${p.milestones.length}</b></div><div><small>Hours logged</small><b>${fmt(hours)}</b></div><div><small>Spent / budget</small><b>${money(spent)} / ${p.budget?money(p.budget):"–"}</b></div></div></section>
    <div class="grid2 section"><section class="card panel"><header class="panel-head"><h2>Log progress</h2></header><form class="form-grid" data-form="build-update" data-id="${esc(p.id)}"><label class="field wide">How far along?<input name="progress" type="range" min="0" max="100" step="5" value="${progress}"></label><label class="field wide">What did you do?<textarea name="note" required placeholder="Describe the update"></textarea></label><label class="field">Date<input name="day" type="date" value="${today()}"></label><label class="field">Hours<input name="hours" type="number" min="0" step=".25" value="0"></label><label class="field">Cost ($)<input name="cost" type="number" min="0" step=".01" value="0"></label><div class="wide"><button class="btn primary">Save update</button></div></form></section>
    ${panel("Milestones",`<form class="plan-add" data-form="add-build-milestone" data-id="${esc(p.id)}"><input name="title" placeholder="Add a milestone" required><button class="btn">＋ Add</button></form><ul class="timeline section">${p.milestones.map(m=>`<li><button class="btn small" data-action="toggle-build-milestone" data-id="${esc(m.id)}">${m.done?"✓":"○"}</button><span class="grow">${esc(m.title)}</span><button class="btn small" data-action="delete-build-milestone" data-id="${esc(m.id)}">×</button></li>`).join("")||`<li class="muted">No milestones yet.</li>`}</ul>`)}</div>
    <div class="grid2 section">${panel("Build log",p.updates.map(u=>`<div class="feed"><b>${esc(u.note)}</b><div class="small muted">${esc(u.day)} · ${u.progress==null?"":u.progress+"% · "}${fmt(u.hours)} h · ${money(u.cost)}</div><button class="btn small" data-action="delete-update" data-id="${esc(u.id)}">Remove</button></div>`).join("")||`<div class="empty">Nothing logged yet.</div>`)}${panel("Progress",`<div class="chart-placeholder" aria-label="Progress log">${p.updates.map(u=>`<i title="${esc(u.day)} · ${u.progress}% " style="height:${Math.max(5,u.progress||0)}%;background:${COLORS[p.color%8]}"></i>`).join("")||`<small>Log an update to see progress.</small>`}</div>`)}</div>`;
  }
  return `<div class="page-head"><div><div class="eyebrow">▣ Workshop</div><h1>Physical builds</h1><p>Builds and repairs you log by hand: progress, milestones, hours and money.</p></div><button class="btn primary" data-action="new-build">＋ New build</button></div>
    <div class="build-grid">${state.physical.map(p=>{const n=p.milestones.filter(m=>m.done).length,pr=p.updates.find(u=>u.progress!=null)?.progress??(p.milestones.length?Math.round(n/p.milestones.length*100):0);return `<article class="card build-card" data-action="open-build" data-id="${esc(p.id)}"><div>${ring(pr,70,COLORS[p.color%8],"done")}</div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.category)} · ${esc(p.status)}</p><div class="build-stats"><span>⚑ ${n}/${p.milestones.length}</span><span>${money(p.updates.reduce((a,u)=>a+(+u.cost||0),0))} spent</span><span>${fmt(p.updates.reduce((a,u)=>a+(+u.hours||0),0))} h</span></div></article>`}).join("")||`<div class="empty">No physical projects yet.</div>`}</div>`;
}
function ytView(){
  const a=state.analytics;
  if(!a||!Array.isArray(a.apps)||!a.apps.length)return `<div class="page-head"><div><div class="eyebrow">◷ Analytics</div><h1>YT Dashboard</h1><p>Traffic, money, and reviews per site or app.</p></div></div>
    <div class="stats-grid">${["Visitors","Revenue","Money spent","Profit","Time on site","Rating"].map(x=>`<div class="yt-kpi"><span>${x}</span><b>N/A</b><small>No data yet</small></div>`).join("")}</div>
    <div class="card yt-banner"><span>ⓘ</span><div><b>Nothing is connected yet.</b> There is no analytics provider or real traffic data configured in this copy. The original dashboard also shows N/A until data is supplied. To avoid inventing numbers, this prototype keeps the panels empty.</div></div>
    ${panel("Daily visitors",`<div class="chart-placeholder">${Array.from({length:12},()=>"<i></i>").join("")}</div>`)}
    ${panel("Revenue & audience",`<div class="empty">N/A · Importing provider data would require a trusted backend integration. Do not put analytics credentials into Artifact source code.</div>`)}`;
  return `<div class="page-head"><div><div class="eyebrow">◷ Analytics</div><h1>YT Dashboard</h1><p>Imported, user-supplied analytics only.</p></div></div><div class="warning">Data is local to this Artifact view. Do not import confidential customer or account information.</div>`;
}
function settingsView(){
  return `<div class="page-head"><div><div class="eyebrow">⚙ Preferences</div><h1>Data & settings</h1><p>Browser-side prototype controls. Import/export JSON to move your own data.</p></div></div>
  <div class="settings-grid">
    ${panel("Portable data",`<p>Changes are saved best-effort in this browser/Artifact context. Download JSON for a portable backup; import it on another device to bring your data there.</p><div class="plan-add"><button class="btn primary" data-action="export">↓ Export JSON</button><label class="btn">↑ Import JSON<input type="file" accept=".json,application/json" data-action="import" hidden></label></div><p class="small">Import replaces the current Artifact data after validation. Use only data you are authorized to share.</p>`)}
    ${panel("Appearance",`<p>Choose the dashboard color scheme.</p><button class="btn" data-action="theme">◐ Switch to ${document.documentElement.dataset.theme==="dark"?"light":"dark"} mode</button>`)}
    ${panel("Artifact limitations",`<p>This build cannot read folders, scan Git history, run the local AI CLI, capture browser screenshots, open local apps, host a database, or synchronize edits between people.</p><p>Claude's Artifact sharing controls determine who can open the published app. Anyone with access may be able to view data embedded in the Artifact or imported into their own session.</p>`)}
    ${panel("Restore examples",`<p>Reset this view to synthetic sample projects and builds. Your current browser data will be replaced.</p><button class="btn danger" data-action="reset">Restore synthetic examples</button>`)}</div>`;
}
function render(){
  const app=document.getElementById("app"),page=state.page||"dashboard";
  document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="project")app.innerHTML=projectDetail(state.projects.find(p=>p.id===state.projectId));
  else if(page==="physical")app.innerHTML=physicalView();
  else if(page==="yt")app.innerHTML=ytView();
  else if(page==="settings")app.innerHTML=settingsView();
  else app.innerHTML=dashboard();
}
function go(page){
  state.page=page;state.projectId=null;state.physicalId=null;
  const hash=page==="dashboard"?"#/":page==="physical"?"#/physical":page==="yt"?"#/yt":page==="settings"?"#/settings":"#/";
  if(location.hash!==hash)history.replaceState(null,"",hash);
  persist();render();window.scrollTo(0,0);
}
function openProject(pid){state.projectId=pid;state.page="project";history.replaceState(null,"","#/project/"+encodeURIComponent(pid));persist();render();window.scrollTo(0,0)}
function openBuild(pid){state.physicalId=pid;state.page="physical";history.replaceState(null,"","#/physical/"+encodeURIComponent(pid));persist();render();window.scrollTo(0,0)}
function projectFor(pid){return state.projects.find(p=>p.id===pid)}
function buildFor(pid){return state.physical.find(p=>p.id===pid)}
function setTheme(){
  state.theme=state.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=state.theme;persist();render();
}
function exportData(){
  const data={format:"project-tracker-artifact",version:1,exportedAt:new Date().toISOString(),projects:state.projects,physical:state.physical,analytics:state.analytics,theme:state.theme};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="project-tracker-artifact-data.json";a.click();URL.revokeObjectURL(a.href);showToast("JSON backup downloaded.");
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      if(!obj||!Array.isArray(obj.projects)||!Array.isArray(obj.physical))throw new Error("Expected projects and physical arrays.");
      if(obj.projects.length>500||obj.physical.length>500)throw new Error("Import is larger than the supported limit.");
      state.projects=obj.projects;state.physical=obj.physical;state.analytics=obj.analytics||null;
      state.theme=obj.theme==="dark"?"dark":"light";document.documentElement.dataset.theme=state.theme;persist();go("dashboard");showToast("JSON data imported.");
    }catch(e){showToast("Could not import JSON: "+e.message);}
  };
  reader.readAsText(file);
}
function modal(title,body){
  const root=document.getElementById("overlay");
  root.innerHTML=`<div class="modal" data-action="close-modal"><section class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close">×</button></div>${body}</section></div>`;
  root.querySelector("input,textarea,select")?.focus();
}
function editProjectForm(p){
  const fresh=!p;p=p||{name:"",oneLiner:"",description:"",type:"App",status:"Active",phase:"Idea",progress:0,priority:"Medium",health:"",targetDate:"",technologies:[],notes:""};
  modal(fresh?"New project":"Edit project details",`<form data-form="save-project" data-id="${fresh?"":esc(p.id)}">
    <label class="field">Name<input name="name" required maxlength="100" value="${esc(p.name)}"></label>
    <label class="field">One-line summary<input name="oneLiner" maxlength="180" value="${esc(p.oneLiner||"")}"></label>
    <label class="field">Description<textarea name="description">${esc(p.description||"")}</textarea></label>
    <div class="form-grid"><label class="field">Type<select name="type">${TYPES.map(t=>`<option ${p.type===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label><label class="field">Status<select name="status">${STATUSES.map(t=>`<option ${p.status===t?"selected":""}>${t}</option>`).join("")}</select></label>
    <label class="field">Lifecycle stage<select name="phase">${PHASES.map(t=>`<option ${p.phase===t?"selected":""}>${t}</option>`).join("")}</select></label><label class="field">Priority<select name="priority">${PRIORITIES.map(t=>`<option ${p.priority===t?"selected":""}>${t}</option>`).join("")}</select></label>
    <label class="field">Progress (%)<input name="progress" type="number" min="0" max="100" value="${Number(p.progress)||0}"></label><label class="field">Health (0–100)<input name="health" type="number" min="0" max="100" value="${p.health??""}"></label>
    <label class="field">Target date<input name="targetDate" type="date" value="${esc(p.targetDate||"")}"></label><label class="field">Technologies <small>comma-separated</small><input name="technologies" value="${esc((p.technologies||[]).join(", "))}"></label></div>
    <div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save</button></div></form>`);
}
function editBuildForm(p){
  const isNew=!p;p=p||{name:"",category:"Other",status:"planning",description:"",budget:"",target_date:"",color:0};
  modal(isNew?"New physical build":"Edit physical build",`<form data-form="save-build" data-id="${isNew?"":esc(p.id)}"><label class="field">Name<input name="name" required value="${esc(p.name)}"></label><div class="form-grid"><label class="field">Category<select name="category">${["Drone","Car","3D Printing","Electronics","Woodworking","Home","Other"].map(x=>`<option ${p.category===x?"selected":""}>${x}</option>`).join("")}</select></label><label class="field">Status<select name="status">${["planning","active","paused","done"].map(x=>`<option ${p.status===x?"selected":""}>${x}</option>`).join("")}</select></label><label class="field">Budget ($)<input name="budget" type="number" min="0" value="${p.budget??""}"></label><label class="field">Target date<input name="target_date" type="date" value="${esc(p.target_date||"")}"></label></div><label class="field">Description<textarea name="description">${esc(p.description||"")}</textarea></label><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary">Save</button></div></form>`);
}
function values(form){return Object.fromEntries(new FormData(form).entries())}
function handleClick(e){
  const b=e.target.closest("[data-action]");if(!b)return;
  const act=b.dataset.action,pid=b.dataset.project||"",pid2=b.dataset.id||"";
  if(act==="close-modal"){if(e.target===b||e.target.closest(".icon-btn"))document.getElementById("overlay").innerHTML="";return}
  if(act==="theme"){setTheme();return}
  if(act==="new-project"){editProjectForm();return}
  if(act==="edit-project"){editProjectForm(projectFor(pid2));return}
  if(act==="new-build"){editBuildForm();return}
  if(act==="edit-build"){editBuildForm(buildFor(pid2));return}
  if(act==="open-project"){openProject(pid2);return}
  if(act==="open-build"){openBuild(pid2);return}
  if(act==="back-physical"){state.physicalId=null;render();return}
  if(act==="filter-status"){state.ui.status=b.dataset.value;persist();render();return}
  if(act==="quick-filter"){state.ui.status=b.dataset.value;state.ui.type="all";state.ui.q="";render();document.getElementById("projects")?.scrollIntoView({behavior:"smooth"});return}
  if(act==="view"){state.ui.view=b.dataset.value;persist();render();return}
  if(act==="toggle-task"){
    const p=projectFor(b.dataset.project),t=p?.tasks.find(x=>x.id===b.dataset.id);
    if(t){t.status=t.status==="done"?"todo":t.status==="doing"?"done":"done";t.updatedAt=new Date().toISOString();persist();render()}return;
  }
  if(act==="delete-task"){const p=projectFor(pid);if(p){p.tasks=p.tasks.filter(t=>t.id!==pid2);persist();render()}return}
  if(act==="toggle-milestone"){const p=projectFor(pid);const m=p?.milestones.find(x=>x.id===pid2);if(m){m.status=m.status==="done"?"todo":"done";persist();render()}return}
  if(act==="delete-milestone"){const p=projectFor(pid);if(p){p.milestones=p.milestones.filter(x=>x.id!==pid2);persist();render()}return}
  if(act==="toggle-issue"){const p=projectFor(pid),x=p?.[b.dataset.kind]?.find(y=>y.id===pid2);if(x){x.status=x.status==="resolved"?"open":"resolved";persist();render()}return}
  if(act==="delete-issue"){const p=projectFor(pid);if(p){p[b.dataset.kind]=p[b.dataset.kind].filter(x=>x.id!==pid2);persist();render()}return}
  if(act==="remove-goal"){const p=projectFor(pid);if(p){p.goals.splice(+b.dataset.index,1);persist();render()}return}
  if(act==="toggle-build-milestone"){const m=state.physical.flatMap(x=>x.milestones).find(x=>x.id===pid2);if(m){m.done=!m.done;persist();render()}return}
  if(act==="delete-build-milestone"){const p=state.physical.find(x=>x.milestones.some(m=>m.id===pid2));if(p){p.milestones=p.milestones.filter(m=>m.id!==pid2);persist();render()}return}
  if(act==="delete-update"){const p=state.physical.find(x=>x.updates.some(u=>u.id===pid2));if(p){p.updates=p.updates.filter(u=>u.id!==pid2);persist();render()}return}
  if(act==="delete-project"){const p=projectFor(pid2);if(p&&confirm(`Remove ${p.name} from this Artifact? Export first if you want a backup.`)){state.projects=state.projects.filter(x=>x.id!==pid2);state.page="dashboard";state.projectId=null;persist();render()}return}
  if(act==="delete-build"){const p=buildFor(pid2);if(p&&confirm(`Remove ${p.name}?`)){state.physical=state.physical.filter(x=>x.id!==pid2);state.physicalId=null;persist();render()}return}
  if(act==="regenerate"){render();showToast("Suggestions refreshed from current project tasks.");return}
  if(act==="export"){exportData();return}
  if(act==="reset"){if(confirm("Replace this Artifact data with synthetic examples? Export a backup first if needed.")){state=demoData();document.documentElement.dataset.theme=state.theme;persist();go("dashboard");showToast("Synthetic examples restored.")}return}
  if(act==="delete-build-milestone")return;
}
function handleSubmit(e){
  const form=e.target.closest("form[data-form]");if(!form)return;e.preventDefault();
  const data=values(form),kind=form.dataset.form,pid=form.dataset.project,p=projectFor(pid),bid=form.dataset.id,b=buildFor(bid);
  if(kind==="save-project"){
    const existing=projectFor(form.dataset.id);
    const item={...(existing||{id:id(),createdAt:today(),tasks:[],milestones:[],blockers:[],bugs:[],goals:[],notes:""}),name:data.name.trim(),oneLiner:data.oneLiner.trim(),description:data.description.trim(),type:data.type,status:data.status,phase:data.phase,priority:data.priority,progress:Math.max(0,Math.min(100,+data.progress||0)),health:data.health===""?null:Math.max(0,Math.min(100,+data.health)),targetDate:data.targetDate,technologies:data.technologies.split(",").map(x=>x.trim()).filter(Boolean),updatedAt:new Date().toISOString()};
    if(existing)Object.assign(existing,item);else state.projects.unshift(item);
    state.projectId=item.id;state.page="project";document.getElementById("overlay").innerHTML="";persist();render();showToast(existing?"Project updated.":"Project added.");return;
  }
  if(kind==="save-build"){
    const existing=buildFor(form.dataset.id),item={...(existing||{id:id(),color:state.physical.length%8,milestones:[],updates:[]}),name:data.name.trim(),category:data.category,status:data.status,description:data.description,budget:data.budget===""?null:+data.budget,target_date:data.target_date};
    if(existing)Object.assign(existing,item);else state.physical.unshift(item);
    state.physicalId=item.id;state.page="physical";document.getElementById("overlay").innerHTML="";persist();render();return;
  }
  if(kind==="add-project-task"&&p){p.tasks.push(emptyTask(data.title.trim(),"todo",data.priority));}
  else if(kind==="add-goal"&&p){p.goals.push(data.title.trim());}
  else if(kind==="add-milestone"&&p){p.milestones.push({id:id(),title:data.title.trim(),due:data.due,status:"todo"});}
  else if(kind==="add-issue"&&p){p[form.dataset.kind].push({id:id(),title:data.title.trim(),detail:"",priority:"medium",status:"open"});}
  else if(kind==="add-plan"){
    const t=emptyTask(data.title.trim(),"todo","medium");
    if(data.project&&projectFor(data.project))projectFor(data.project).tasks.push(t);
    else state.planTasks.push({...t,projectId:null});
  }
  else if(kind==="build-update"&&b){
    b.updates.unshift({id:id(),day:data.day||today(),progress:Math.max(0,Math.min(100,+data.progress||0)),note:data.note.trim(),hours:+data.hours||0,cost:+data.cost||0});
  }
  else if(kind==="add-build-milestone"&&b){b.milestones.push({id:id(),title:data.title.trim(),done:false});}
  else return;
  persist();render();showToast("Saved.");
}
document.addEventListener("click",handleClick);
document.addEventListener("submit",handleSubmit);
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.action==="filter-type"){state.ui.type=el.value;persist();render()}
  else if(el.dataset.action==="sort"){state.ui.sort=el.value;persist();render()}
  else if(el.dataset.action==="import"&&el.files?.[0]){importData(el.files[0]);el.value=""}
  else if(el.dataset.action==="notes"){const p=projectFor(el.dataset.project);if(p){p.notes=el.value;persist();showToast("Notes saved.")}}
  else if(el.dataset.action==="notes"===false&&el.matches("[data-action=notes]")){}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.action==="search"){
    state.ui.q=el.value;const start=el.selectionStart;
    clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const next=document.querySelector("[data-action=search]");if(next){next.focus();next.setSelectionRange(start,start)}},80);
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-page]");if(b){go(b.dataset.page);return}
  if(e.target.closest(".modal")&&e.target.classList.contains("modal"))document.getElementById("overlay").innerHTML="";
});
window.addEventListener("hashchange",()=>{
  const h=location.hash||"#/";
  if(h.startsWith("#/project/")){try{openProject(decodeURIComponent(h.slice(10)))}catch(_){go("dashboard")}}
  else if(h==="#/physical"||h.startsWith("#/physical/")){state.page="physical";state.projectId=null;state.physicalId=h.startsWith("#/physical/")?decodeURIComponent(h.slice(11)):null;persist();render()}
  else if(h==="#/yt")go("yt");
  else if(h==="#/settings")go("settings");
  else go("dashboard");
});
document.documentElement.dataset.theme=state.theme||"light";
if(location.hash.startsWith("#/project/")){state.projectId=decodeURIComponent(location.hash.slice(10));state.page="project"}
else if(location.hash.startsWith("#/physical/")){state.page="physical";state.physicalId=decodeURIComponent(location.hash.slice(11))}
else if(location.hash==="#/physical")state.page="physical";
else if(location.hash==="#/yt")state.page="yt";
else if(location.hash==="#/settings")state.page="settings";
render();
})();
</script>
</body>
</html>
