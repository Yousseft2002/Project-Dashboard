services:
  - type: web
    name: project-dashboard
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: TRACKER_DATA_DIR
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OWNER_ID
        sync: false
      - key: GITHUB_REPOSITORIES
        sync: false
      - key: GITHUB_READ_TOKEN
        sync: false
