<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Project Tracker · Sign in</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="box">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3.5"/><path d="M16 7.5a8.5 8.5 0 0 1 8 11.4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></div>
  <h1>Project Tracker</h1>
  <p class="sub">Enter the access code shown on your PC under <b>Settings › Phone access</b>.</p>
  <form id="f" autocomplete="off">
    <label for="code" class="sr">Access code</label>
    <input id="code" name="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false"
           maxlength="20" placeholder="XXXX-XXXX-XXXX" autofocus required>
    <button type="submit" id="go">Sign in</button>
    <p id="err" role="alert" hidden></p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
