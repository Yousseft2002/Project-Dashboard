<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><circle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-opacity='.35' stroke-width='3.5'/><path d='M16 7a9 9 0 0 1 8.5 12' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="planner.css">
<link rel="stylesheet" href="access.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3.5"/><path d="M16 7.5a8.5 8.5 0 0 1 8 11.4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></span>
    <span class="brand-name">Project Tracker</span>
  </a>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/" data-tab="dashboard">Dashboard</a>
    <a href="#/physical" data-tab="physical">Physical</a>
    <a href="#/yt" data-tab="yt">YT Dashboard</a>
  </nav>
  <div class="top-actions">
    <span class="scan-status" id="scanStatus"></span>
    <button class="btn" id="scanBtn" title="Re-scan project folders and AI sessions">Rescan</button>
    <button class="icon-btn" data-act="openSettings" title="Computers & sync" aria-label="Computers and sync settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 9.5h5v5h-5zM9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main id="app" class="app"><div class="empty-state">Loading…</div></main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
